server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API avoids CORS. BACKEND_URL is filled in when the container
    # starts (compose: http://backend:8000; Railway: the backend's private address).
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: stream tokens as they arrive instead of buffering the response
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
