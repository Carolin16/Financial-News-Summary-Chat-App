[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "chat-app"
version = "0.1.0"
description = "Grounded chat over financial news: hybrid retrieval (Qdrant dense + BM25, RRF) with cited summaries."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "sse-starlette>=3.4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # fastembed extra provides the BM25 sparse encoder used alongside dense vectors
    "qdrant-client[fastembed]>=1.19",
    "openai>=3.19",
    "tiktoken>=0.14",
    "pysbd>=0.3.4",
    "ftfy>=6.3",
    "httpx>=0.28",
]

[project.scripts]
chat-index = "chat_app.ingestion.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "black>=26.5",
    "ruff>=0.16",
    "mypy>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chat_app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# pysbd ships without type information.
module = ["pysbd"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The eval suite calls the live LLM (cost, latency, nondeterminism): opt in with `-m eval`.
addopts = "-m 'not eval'"
markers = [
    "integration: needs a running Qdrant instance",
    "eval: runs the reference query suite against the live LLM",
]
