    notes: Balanced answer needs both the target raises and at least one bearish view.

  - id: q5
    query: "What's Nvidia's price target?"
    expected_outcome: answer
    expected_source_links:
      - link: https://finance.yahoo.com/news/dbs-bank-adjusts-nvidia-price-151516884.html
        needs_review: true
        note: DBS $160 from $175 (title); mean target $174.93 in the same stub
      - link: https://finance.yahoo.com/news/nvidia-set-beat-earnings-near-174914435.html
        needs_review: true
        note: BofA earnings preview; text has no price-target figure
      - link: https://finance.yahoo.com/news/nvidia-set-beat-q4-earnings-175151694.html
        needs_review: true
        note: BofA earnings preview; text has no price-target figure
    required_views: []
    counterfactuals:
      - name: dbs_target_changed
        # $153 is a value no model would recall for DBS; the answer must report it.
        replacements:
          - old: "$160"
            new: "$153"
        expect:
          include_figures: ["$153"]
          exclude_figures: ["$160"]
    ablations:
      - name: dbs_article_removed
        drop_links:
          - https://finance.yahoo.com/news/dbs-bank-adjusts-nvidia-price-151516884.html
        # Only DBS's own figures; the $174.93 mean sits in the same stub, so it isn't asserted.
        expect:
          exclude_figures: ["$160", "$175"]
    notes: A single firm's target (DBS $160) must be kept distinct from the consensus ($174.93).

  - id: q6
    query: "Why did Intel stock jump?"
    expected_outcome: answer
    expected_source_links:
      - link: https://finance.yahoo.com/news/intel-intc-stock-trades-why-175148102.html
        needs_review: true
        note: jump attributed to the WSJ report on Broadcom/TSMC talks
      - link: https://finance.yahoo.com/news/intel-stock-surges-on-report-of-broadcom-tsmc-exploring-deals-that-would-split-up-chipmaker-140021691.html
        needs_review: true
      - link: https://finance.yahoo.com/news/intel-stock-pops-5-because-133000571.html
        needs_review: true
      - link: https://finance.yahoo.com/news/why-intel-shares-skyrocketing-today-182934623.html
        needs_review: true
      - link: https://finance.yahoo.com/news/intel-shares-jump-report-potential-170523696.html
        needs_review: true
        note: stub
      - link: https://finance.yahoo.com/video/broadcom-tsmc-consider-possible-deals-143700997.html
        needs_review: true
        note: stub
    required_views: []
    counterfactuals:
      - name: broadcom_renamed
        # A fictitious buyer: an answer naming it can only have come from the passages.
        replacements:
          - old: "Broadcom"
            new: "Veltrix Semiconductor"
          - old: "AVGO"
            new: "VLTX"
        expect:
          include_terms: ["Veltrix"]
          exclude_terms: ["Broadcom", "AVGO"]
    ablations:
      - name: deal_reports_removed
        # Every Intel-tagged article that names Broadcom or TSMC, plus the two deal stubs.
        drop_links:
          - https://finance.yahoo.com/news/intel-intc-stock-trades-why-175148102.html
          - https://finance.yahoo.com/news/intel-stock-surges-on-report-of-broadcom-tsmc-exploring-deals-that-would-split-up-chipmaker-140021691.html
          - https://finance.yahoo.com/news/intel-stock-pops-5-because-133000571.html
          - https://finance.yahoo.com/news/why-intel-shares-skyrocketing-today-182934623.html
          - https://finance.yahoo.com/news/intel-could-split-rivals-heres-161600625.html
          - https://finance.yahoo.com/news/why-intel-could-be-worth-more-than-200-billion-if-it-breaks-up-154736492.html
          - https://finance.yahoo.com/news/fade-rally-intel-stock-chip-131243296.html
          - https://finance.yahoo.com/m/29d31f3b-b489-393c-8ba3-703f8317f2f6/where-will-intel-stock-be-in.html
          - https://finance.yahoo.com/video/homebuyer-advice-mistakes-budgeting-strategies-181000459.html
          - https://finance.yahoo.com/video/nike-skims-intel-deals-medtronic-161658041.html
          - https://finance.yahoo.com/video/walmart-q4-earnings-preview-delta-155442998.html
          - https://finance.yahoo.com/video/broadcom-tsmc-consider-possible-deals-143700997.html
          - https://finance.yahoo.com/news/intel-shares-jump-report-potential-170523696.html
          - https://finance.yahoo.com/m/5353057b-6060-30ed-8868-e46c46795567/intel-breakup-mulled-as.html
        expect:
          exclude_terms: ["Broadcom", "AVGO", "TSMC", "Taiwan Semiconductor"]
    notes: The stated cause must be the Broadcom/TSMC deal report, nothing invented.

