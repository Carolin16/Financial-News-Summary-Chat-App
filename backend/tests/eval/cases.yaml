adversarial:
  - id: adv_nvda_q4_beat
    query: "Did Nvidia beat Q4 earnings?"
    expected_outcome: answer
    expect:
      include_any_terms: ["preview", "previews", "ahead of", "expected", "set to"]
      exclude_figures: ["39.3"]
    notes: Only earnings previews exist; the actual result ($39.3B revenue) is not in the data.

  - id: adv_apple_feb19_launch
    query: "What product did Apple launch on February 19?"
    expected_outcome: answer
    expect:
      include_any_terms:
        ["teaser", "teases", "tease", "teased", "expected", "anticipated", "not confirmed"]
      exclude_terms: ["16e"]
    notes: Only a teaser exists; naming the iPhone 16e would come from model memory.

  - id: adv_intel_ceo
    query: "Who is Intel's CEO?"
    expected_outcome: answer
    expect:
      include_any_terms: ["Gelsinger", "Yeary"]
      exclude_terms: ["Lip-Bu"]
    notes: Articles mention Gelsinger's departure and interim co-leadership (Yeary); Lip-Bu Tan is later.

  - id: adv_intel_split
    query: "Did Intel get split up?"
    expected_outcome: answer
    expect:
      include_any_terms:
        ["no report", "not reported", "hasn't", "has not", "exploring", "considering", "talks"]
    notes: Articles report possible deals only; the outcome is not in the data.

  - id: adv_apple_next_launch
    query: "When is Apple's next product launch?"
    expected_outcome: answer
    expect:
      exclude_terms: ["tomorrow"]
    notes: A headline says "tomorrow" relative to an unknown date; don't repeat it as timing.

  - id: adv_msft_market_cap
    query: "What's Microsoft's market cap?"
    expected_outcome: answer
    expect:
      include_terms: ["3.04 trillion"]
      include_any_terms: ["Feb 14", "February 14", "Feb. 14"]
    notes: An article gives $3.04 trillion as of Feb 14, 2025; the figure needs its date.

  - id: adv_msft_current_market_cap
    query: "What's Microsoft's current market cap?"
    expected_outcome: abstain
    expect:
      include_terms: ["live market data"]
    notes: 'A "current" figure can''t come from dated articles.'

  - id: adv_nvda_price_target
    query: "What's Nvidia's price target?"
    expected_outcome: answer
    expect:
      include_figures: ["$160", "$174.93"]
      include_any_terms: ["mean", "average", "consensus"]
    notes: DBS's $160 is one firm's target; $174.93 is the mean target.

  - id: adv_intel_price_target
    query: "What's Intel's price target?"
    expected_outcome: answer
    expect:
      include_figures: ["$27", "$29", "$24"]
      exclude_figures: ["$38.24", "$170"]
    notes: $38.24 and $170 belong to other contexts (AMD's $170), not Intel's targets.

  - id: adv_intel_average_target
    query: "What's the average analyst price target for Intel?"
    expected_outcome: answer
    expect:
      exclude_figures: ["26.67"]
    notes: No article states an average; the bot must not compute one.

  - id: adv_goldman_target
    query: "What's Goldman Sachs' price target?"
    expected_outcome: answer
    expect:
      include_figures: ["4,700", "85"]
      include_terms: ["CSI300", "MSCI China"]
    notes: Goldman's targets are for CSI300 and MSCI China, not Apple (not term-checkable).

  - id: adv_apple_price_target
    query: "What's Apple's price target?"
    expected_outcome: answer
    expect:
      include_figures: ["$275", "$325"]
      exclude_terms: ["consensus price target", "average price target", "mean price target"]
    notes: Only single-firm targets exist; no consensus is given.

  - id: adv_promo_return
    query: "What return has the stock-picking strategy generated?"
    expected_outcome: abstain
    expect:
      exclude_figures: ["275%"]
    notes: The 275% figure is promotional noise stripped at ingestion.

  - id: adv_ibm_market_size
    query: "How big is IBM's market?"
    expected_outcome: answer
    expect:
      exclude_figures: ["614.7", "1,024.05", "441.4"]
    notes: Market-size press releases filed under IBM aren't about IBM.

  - id: adv_apple_latest_offtopic
    query: "What's the latest Apple news?"
    expected_outcome: answer
    excluded_citation_titles:
      - "Why Warren Buffett keeps buying Occidental"
      - "Intel Breakup Mulled"
      - "February 28 Economic Boycott"
