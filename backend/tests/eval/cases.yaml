# Eval cases: each query and what a correct response looks like.
#
# expected_outcome: answer | answer_with_disclaimer | abstain
# expected_source_links: gold articles for retrieval recall. Proposed links carry
#   needs_review: true until a person confirms them; only reviewed links gate recall.
# required_views: views the answer must include (checked by the balance judge).
# counterfactuals: edit retrieved passages; the answer must follow the edit (proves the
#   answer comes from the sources, not model memory).
# ablations: drop retrieved passages by link; the answer must not state what only they said.
# expect: what the live answer must/must not contain (include_terms, exclude_terms,
#   include_any_terms, include_figures, exclude_figures). Terms match whole tokens.
# excluded_citation_titles: title prefixes of articles the answer must not cite.

